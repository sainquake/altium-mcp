name: Tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    # The server only runs on Windows (pywin32, Altium), and one test reads
    # the ANSI code page
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      # The same hash-locked set start_server.py installs into its venv, so a
      # lock that no longer installs fails here instead of on a user's machine
      - name: Install requirements
        run: python -m pip install -r requirements.txt

      # Offline tests only. tests/test_altium_script.py drives a running
      # Altium Designer and cannot run here. Tests extract MCP functions
      # without importing main.py or starting the live bridge.
      - name: Run unit tests
        run: >-
          python -m unittest -v
          server.tests.test_altium_files server.tests.test_altium_install
          server.tests.test_document_management server.tests.test_drc
          server.tests.test_exchange_lock server.tests.test_label_blocks
          server.tests.test_launcher_setup server.tests.test_lcsc_catalog
          server.tests.test_library_component_data server.tests.test_merge_compatibility
          server.tests.test_open_targets server.tests.test_outjob_parser
          server.tests.test_pcb_rules server.tests.test_pcb_shapes server.tests.test_pcblib_file
          server.tests.test_project_components server.tests.test_project_selection
          server.tests.test_request_format server.tests.test_routing server.tests.test_sandbox
          server.tests.test_sch_edit server.tests.test_schematic_check
          server.tests.test_schematic_connectivity server.tests.test_schematic_editor
          server.tests.test_script_bundle server.tests.test_server_info server.tests.test_silkscreen
          server.tests.test_start_server server.tests.test_symbol_metadata server.tests.test_win_processes
